<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2743d8"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8fa0"/></marker>
  </defs>
  <rect width="900" height="372" fill="#ffffff"/>
  <text x="25" y="26" font-size="15" font-weight="bold" fill="#1b1e27">One purchase, end to end</text>
  <text x="875" y="26" font-size="11" fill="#5b5f6e" text-anchor="end">the same path for Razorpay, the mock and agent purchases</text>

  <!-- row 1 -->
  <g>
    <rect x="25" y="48" width="190" height="92" rx="10" fill="#eef1fd" stroke="#2743d8"/>
    <circle cx="47" cy="70" r="11" fill="#2743d8"/><text x="47" y="74" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
    <text x="66" y="74" font-weight="bold" fill="#1b1e27">Checkout</text>
    <text x="39" y="98" fill="#2b2f3c">Server prices the cart;</text>
    <text x="39" y="114" fill="#2b2f3c">order saved as PENDING</text>
    <text x="39" y="131" font-size="10.5" fill="#5b5f6e">services/orders.js</text>
  </g>
  <g>
    <rect x="245" y="48" width="190" height="92" rx="10" fill="#fff4e0" stroke="#b07a00"/>
    <circle cx="267" cy="70" r="11" fill="#b07a00"/><text x="267" y="74" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
    <text x="286" y="74" font-weight="bold" fill="#1b1e27">Provider</text>
    <text x="259" y="98" fill="#2b2f3c">User pays at Razorpay</text>
    <text x="259" y="114" fill="#2b2f3c">(test mode) or the mock</text>
    <text x="259" y="131" font-size="10.5" fill="#5b5f6e">adapter.createPayment()</text>
  </g>
  <g>
    <rect x="465" y="48" width="190" height="92" rx="10" fill="#eef1fd" stroke="#2743d8"/>
    <circle cx="487" cy="70" r="11" fill="#2743d8"/><text x="487" y="74" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
    <text x="506" y="74" font-weight="bold" fill="#1b1e27">Webhook</text>
    <text x="479" y="98" fill="#2b2f3c">Signature checked on</text>
    <text x="479" y="114" fill="#2b2f3c">the raw body</text>
    <text x="479" y="131" font-size="10.5" fill="#5b5f6e">POST /webhooks/:provider</text>
  </g>
  <g>
    <rect x="685" y="48" width="190" height="92" rx="10" fill="#eef1fd" stroke="#2743d8"/>
    <circle cx="707" cy="70" r="11" fill="#2743d8"/><text x="707" y="74" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
    <text x="726" y="74" font-weight="bold" fill="#1b1e27">Inbox</text>
    <text x="699" y="98" fill="#2b2f3c">Stored by (provider, event</text>
    <text x="699" y="114" fill="#2b2f3c">id); a repeat is ignored</text>
    <text x="699" y="131" font-size="10.5" fill="#5b5f6e">webhook_inbox</text>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="25" y="198" width="190" height="92" rx="10" fill="#eef1fd" stroke="#2743d8"/>
    <circle cx="47" cy="220" r="11" fill="#2743d8"/><text x="47" y="224" fill="#fff" font-weight="bold" text-anchor="middle">5</text>
    <text x="66" y="224" font-weight="bold" fill="#1b1e27">Processor</text>
    <text x="39" y="248" fill="#2b2f3c">Payment must match the</text>
    <text x="39" y="264" fill="#2b2f3c">order: user, amount, currency</text>
    <text x="39" y="281" font-size="10.5" fill="#5b5f6e">else UNDERPAID, no access</text>
  </g>
  <g>
    <rect x="245" y="198" width="190" height="92" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
    <circle cx="267" cy="220" r="11" fill="#2e7d32"/><text x="267" y="224" fill="#fff" font-weight="bold" text-anchor="middle">6</text>
    <text x="286" y="224" font-weight="bold" fill="#1b1e27">Ledger</text>
    <text x="259" y="248" fill="#2b2f3c">PURCHASE_SUCCEEDED</text>
    <text x="259" y="264" fill="#2b2f3c">appended; never edited</text>
    <text x="259" y="281" font-size="10.5" fill="#5b5f6e">commerce_ledger (triggers)</text>
  </g>
  <g>
    <rect x="465" y="198" width="190" height="92" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
    <circle cx="487" cy="220" r="11" fill="#2e7d32"/><text x="487" y="224" fill="#fff" font-weight="bold" text-anchor="middle">7</text>
    <text x="506" y="224" font-weight="bold" fill="#1b1e27">Projection</text>
    <text x="479" y="248" fill="#2b2f3c">Current entitlements</text>
    <text x="479" y="264" fill="#2b2f3c">rebuilt from the events</text>
    <text x="479" y="281" font-size="10.5" fill="#5b5f6e">domain/projection.js</text>
  </g>
  <g>
    <rect x="685" y="198" width="190" height="92" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
    <circle cx="707" cy="220" r="11" fill="#2e7d32"/><text x="707" y="224" fill="#fff" font-weight="bold" text-anchor="middle">8</text>
    <text x="726" y="224" font-weight="bold" fill="#1b1e27">Decision</text>
    <text x="699" y="248" fill="#2b2f3c">Every request: allowed</text>
    <text x="699" y="264" fill="#2b2f3c">or denied, with a reason</text>
    <text x="699" y="281" font-size="10.5" fill="#5b5f6e">e.g. ACTIVE_PURCHASE</text>
  </g>

  <!-- arrows -->
  <line x1="215" y1="94" x2="243" y2="94" stroke="#2743d8" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="435" y1="94" x2="463" y2="94" stroke="#2743d8" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="655" y1="94" x2="683" y2="94" stroke="#2743d8" stroke-width="1.6" marker-end="url(#ar)"/>
  <polyline points="780,140 780,169 120,169 120,196" fill="none" stroke="#2743d8" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="215" y1="244" x2="243" y2="244" stroke="#2743d8" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="435" y1="244" x2="463" y2="244" stroke="#2743d8" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="655" y1="244" x2="683" y2="244" stroke="#2743d8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- safety nets -->
  <rect x="25" y="314" width="415" height="44" rx="8" fill="#f7f8fc" stroke="#d9ddea"/>
  <text x="39" y="333" font-weight="bold" fill="#1f36b0">Can't apply yet (e.g. refund before purchase)</text>
  <text x="39" y="350" fill="#2b2f3c">answered "retry later"; retry worker: 30 s … 1 h, DEAD after 8</text>
  <rect x="460" y="314" width="415" height="44" rx="8" fill="#f7f8fc" stroke="#d9ddea"/>
  <text x="474" y="333" font-weight="bold" fill="#1f36b0">Webhook never arrives</text>
  <text x="474" y="350" fill="#2b2f3c">reconciliation compares with the provider, replays it at step 4</text>
</svg>
